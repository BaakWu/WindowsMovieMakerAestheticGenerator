<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Classic Movie Title Maker</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1>Classic Movie Title Maker</h1>
      <p class="app__subtitle">Windows Movie Maker &middot; Old YouTube title cards &middot; <span id="webcodecs-support" class="badge badge--checking">checking…</span></p>
    </header>

    <div class="layout">
      <section class="controls" aria-label="Controls">
        <div class="field">
          <label for="title">Title text</label>
          <textarea id="title" rows="3" placeholder="e.g.&#10;Your&#10;Title Here">Your Title Here</textarea>
        </div>

        <div class="field">
          <label for="author">Author / subtitle line <span class="hint">(optional)</span></label>
          <input id="author" type="text" placeholder="e.g. Your subtitle here" value="Your subtitle here" />
        </div>

        <div class="grid2">
          <div class="field">
            <label for="font">Font</label>
            <select id="font">
              <option value="Segoe UI" selected>Segoe UI</option>
              <option value="Segoe Print">Segoe Print</option>
              <option value="Arial">Arial</option>
              <option value="Comic Sans MS">Comic Sans MS</option>
              <option value="Impact">Impact</option>
              <option value="Courier New">Courier New</option>
              <option value="Georgia">Georgia</option>
              <option value="Times New Roman">Times New Roman</option>
            </select>
          </div>
          <div class="field">
            <label for="weight">Weight</label>
            <select id="weight">
              <option value="400" selected>Regular</option>
              <option value="700">Bold</option>
            </select>
          </div>
        </div>

        <div class="grid2">
          <div class="field">
            <label for="bgColor">Background</label>
            <div class="color-row">
              <input id="bgColor" type="color" value="#104080" />
              <div class="swatches" aria-label="Preset colors">
                <button type="button" class="swatch" data-color="#104080" title="#104080" style="background:#104080"></button>
                <button type="button" class="swatch" data-color="#3778BF" title="#3778BF" style="background:#3778BF"></button>
              </div>
            </div>
          </div>
          <div class="field">
            <label for="textColor">Text color</label>
            <div class="color-row">
              <input id="textColor" type="color" value="#ffffff" />
              <button type="button" class="swatch swatch--white" data-color="#ffffff" title="#ffffff" style="background:#ffffff"></button>
            </div>
          </div>
        </div>

        <div class="field">
          <label for="size">Text size <span class="hint">(<span id="sizeVal">100</span>%)</span></label>
          <input id="size" type="range" min="40" max="220" value="100" />
        </div>

        <fieldset class="seg" id="mode">
          <label class="seg__option">
            <input type="radio" name="mode" value="image" checked />
            <span>Image</span>
          </label>
          <label class="seg__option">
            <input type="radio" name="mode" value="video" />
            <span>Video (.mp4)</span>
          </label>
        </fieldset>

        <div class="output-settings" id="output-settings">
          <div class="field" id="img-block">
            <label for="imgFormat">Format</label>
            <select id="imgFormat">
              <option value="image/png" selected>PNG (lossless)</option>
              <option value="image/jpeg">JPEG (smaller)</option>
            </select>
          </div>

          <div class="grid2" id="video-block" hidden>
            <div class="field">
              <label for="duration">Duration <span class="hint">(<span id="durVal">5</span>s, max 10)</span></label>
              <input id="duration" type="range" min="1" max="10" value="5" />
            </div>
            <div class="field">
              <label for="fps">Frame rate <span class="hint">(<span id="fpsVal">30</span> fps, max 60)</span></label>
              <input id="fps" type="range" min="10" max="60" value="30" />
            </div>
          </div>

          <div class="field" id="animate-block">
            <label for="effect">Animation</label>
            <select id="effect">
              <option value="none" selected>None</option>
              <option value="fly-in">Title fly-in</option>
              <option value="moving">Moving titles (scrolling background)</option>
            </select>
            <div class="animate-block__dir" id="effect-dir">
              <label for="effectDir">Fly-in direction</label>
              <select id="effectDir">
                <option value="bottom" selected>From bottom</option>
                <option value="bottom-left">From bottom-left</option>
                <option value="bottom-right">From bottom-right</option>
                <option value="left">From left</option>
                <option value="right">From right</option>
                <option value="top">From top</option>
                <option value="top-left">From top-left</option>
                <option value="top-right">From top-right</option>
              </select>
            </div>
            <div class="animate-block__dir" id="effect-fadeout">
              <label class="check">
                <input id="fadeOut" type="checkbox" />
                <span>Fade all text out at the end</span>
              </label>
            </div>
          </div>
        </div>

        <div class="field">
          <label for="resPreset">Resolution</label>
          <select id="resPreset">
            <optgroup label="16:9 widescreen">
              <option value="2560x1440">2560 × 1440 (1440p)</option>
              <option value="1920x1080" selected>1920 × 1080 (1080p)</option>
              <option value="1280x720">1280 × 720 (720p)</option>
            </optgroup>
            <optgroup label="4:3 standard">
              <option value="2560x1920">2560 × 1920</option>
              <option value="2048x1536">2048 × 1536</option>
              <option value="1600x1200">1600 × 1200</option>
              <option value="1280x960">1280 × 960</option>
              <option value="1024x768">1024 × 768</option>
              <option value="640x480">640 × 480</option>
            </optgroup>
            <option value="custom">Custom…</option>
          </select>
        </div>

        <div class="field grid2" id="custom-res" hidden>
          <div>
            <label for="resW">Width</label>
            <input id="resW" type="number" min="160" max="6000" step="2" value="1920" />
          </div>
          <div>
            <label for="resH">Height</label>
            <input id="resH" type="number" min="120" max="6000" step="2" value="1080" />
          </div>
        </div>

        <div class="actions">
          <button id="download" class="btn btn--primary" type="button">Download</button>
        </div>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </section>

      <section class="preview" aria-label="Live preview">
        <div class="preview__frame">
          <video id="previewVideo" controls playsinline muted autoplay loop hidden></video>
          <canvas id="canvas" width="1920" height="1080"></canvas>
          <div id="progress" class="preview__progress" hidden>
            <span class="preview__progress-label">Rendering preview…</span>
            <span id="progressValue" class="preview__progress-value">0%</span>
            <div class="preview__progress-bar"><div id="progressBar" class="preview__progress-fill"></div></div>
          </div>
        </div>
        <div class="preview__meta">
          <span id="resReadout">1920 × 1080</span>
        </div>
      </section>
    </div>
  </main>

  <script src="./app.js"></script>
</body>
</html>
